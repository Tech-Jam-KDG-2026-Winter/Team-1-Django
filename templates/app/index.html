{% extends 'base.html' %}
{% block title %}Your Diaries - my pace{% endblock %}

{% block content %}
<div class="index-container">
    <div class="write-link-area">
        <a href="{% url 'diary_write' %}" class="btn-write">Write Diary</a>
    </div>

    <h3>Your Diaries</h3>

    <div class="search-toggle-area">
        <button type="button" class="btn-toggle-search" onclick="toggleSearch()">
            <i class="fa-solid fa-magnifying-glass fa-lg" style="color: #3f4a5a;"></i> search
        </button>
    </div>
    <section class="search-section" id="search-section" style="display: none;">
        <form method="get" class="search-form">
            <input type="text" name="q" placeholder="キーワード (本文・AI返信)" value="{{ request.GET.q }}">
            <div class="date-range">
                <input type="date" name="start_date" value="{{ request.GET.start_date }}"> 〜 
                <input type="date" name="end_date" value="{{ request.GET.end_date }}">
            </div>
            <div class="search-buttons">
                <button type="submit" class="btn-search">検索</button>
                <a href="{% url 'index' %}" class="btn-reset">リセット</a>
            </div>
        </form>
    </section>

    <section class="diary-list">
        {% for diary in diaries %}
            <a href="{% url 'diary_detail' diary.pk %}" class="diary-item">
                <span class="date">{{ diary.date|date:"Y年m月d日" }}</span>
                <p class="excerpt">{{ diary.content|truncatechars:30 }}</p>
            </a>
        {% empty %}
            <p>条件に合う日記が見つかりません。</p>
        {% endfor %}
    </section>
</div>
{% endblock %}
